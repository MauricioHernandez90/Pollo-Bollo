<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pollo Bollo Game</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Chewy&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#04060e;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',system-ui;overflow:hidden}
.phone{position:relative;width:min(100vw,540px);height:min(100dvh,177.78vw);aspect-ratio:9/16;background:#04060e url('assets/space-bg.svg');background-size:cover;background-position:center;border-radius:32px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.8)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;transition:opacity .3s}
.screen.hidden{opacity:0;pointer-events:none}
#splash{background:linear-gradient(180deg, rgba(4,6,14,.2) 0%, rgba(4,6,14,.85) 100%), url('assets/space-bg.svg');background-size:cover}
.splash-content{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%;padding:20px}
.hint{color:#fff;font-size:14px;text-align:center;opacity:.9;margin:8px 0 18px;line-height:1.3}
.btn-jugar{font-family:'Chewy';font-size:26px;background:linear-gradient(180deg,#ffd400,#ff9d00);color:#3a0b5e;border:none;padding:16px 36px;border-radius:20px;box-shadow:0 6px 0 #b86e00,0 14px 32px rgba(0,0,0,.5);cursor:pointer;animation:pulse 1.2s infinite;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.btn-jugar:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 #b86e00}
#loadingScreen{background:radial-gradient(120% 120% at 50% 0%, #0a0a1a 0%, #04060e 70%, #000 100%);z-index:100}
.load-box{display:flex;flex-direction:column;align-items:center;gap:16px;width:84%;max-width:340px}
.load-title{font-family:'Chewy';font-size:24px;color:#ffd400;letter-spacing:1px}
.load-bar-bg{width:100%;height:16px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.load-bar{height:100%;width:0%;background:linear-gradient(90deg,#ffd400,#ff7a00);border-radius:999px;transition:width .15s;box-shadow:0 0 14px #ffd400}
.load-pct{font-weight:800;color:#fff;font-size:14px}
.load-detail{font-size:11px;color:rgba(255,255,255,.6)}
#hud{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;pointer-events:none}
.score-badge{background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);color:#fff;font-weight:800;font-size:18px;padding:6px 14px;border-radius:999px;min-width:44px;text-align:center}
.lives{font-size:22px;letter-spacing:2px;text-shadow:0 0 8px rgba(255,42,90,.8)}
#gameover{background:linear-gradient(180deg, rgba(4,6,14,.4) 0%, rgba(4,6,14,.95) 100%), url('assets/space-bg.svg');background-size:cover}
.avatar{width:110px;height:110px;border-radius:50%;border:4px solid #ffd400;box-shadow:0 0 20px rgba(255,212,0,.5);margin-bottom:10px;object-fit:cover}
.fin{font-family:'Chewy';font-size:34px;color:#ffd400;text-shadow:0 3px 0 #3a0b5e;margin:6px 0}
.score-big{font-family:'Chewy';font-size:56px;color:#fff;text-shadow:0 3px 0 #3a0b5e}
.msg{color:rgba(255,255,255,.85);font-size:14px;margin:6px 0 14px;text-align:center;padding:0 20px}
.btn-group{display:flex;flex-direction:column;gap:12px;width:84%;max-width:300px}
.btn-what{font-family:'Baloo 2';font-weight:800;font-size:18px;background:linear-gradient(180deg,#25D366,#128C7E);color:#fff;border:none;padding:14px 22px;border-radius:16px;box-shadow:0 6px 0 #0b5a4e,0 12px 24px rgba(0,0,0,.4);text-decoration:none;display:block;text-align:center;cursor:pointer}
.btn-retry{font-family:'Chewy';font-size:20px;background:linear-gradient(180deg,#ffd400,#ff9d00);color:#3a0b5e;border:none;padding:14px 22px;border-radius:16px;box-shadow:0 6px 0 #b86e00,0 12px 24px rgba(0,0,0,.4);cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <canvas id="gameCanvas" width="540" height="960"></canvas>
  <div id="hud"><div class="score-badge" id="scoreEl">0</div><div class="lives" id="livesEl">❤️❤️❤️</div></div>
  <div class="screen" id="splash">
    <div class="splash-content">
      <div style="flex:1"></div>
      <img id="logoMain" src="assets/pollo-normal.webp" style="width:84%;max-width:340px;filter:drop-shadow(0 0 22px rgba(255,212,0,.6)) drop-shadow(0 6px 18px rgba(0,0,0,.7));background:transparent;display:block;margin-bottom:12px" alt="Pollo Bollo">
      <div class="hint">¡Revienta globos!<br>Toca para disparar confeti</div>
      <button class="btn-jugar" id="btnPlay" type="button">TOCA PARA JUGAR</button>
      <div style="flex:.6"></div>
    </div>
  </div>
  <div class="screen hidden" id="loadingScreen">
    <div class="load-box">
      <img src="assets/pollo-normal.webp" style="width:64%;max-width:270px;filter:drop-shadow(0 0 18px rgba(255,212,0,.5));margin-bottom:6px;background:transparent" alt="Pollo Bollo">
      <div class="load-title">Cargando diversión...</div>
      <div class="load-bar-bg"><div class="load-bar" id="loadBar"></div></div>
      <div class="load-pct" id="loadPct">0%</div>
      <div class="load-detail" id="loadDetail">Preparando nave...</div>
    </div>
  </div>
  <div class="screen hidden" id="gameover">
    <img class="avatar" id="avatar" src="assets/pollo-avatar.png" alt="pollo">
    <img src="assets/pollo-normal.webp" style="width:60%;max-width:250px;filter:drop-shadow(0 0 14px rgba(255,212,0,.4));margin-bottom:8px;background:transparent" alt="Pollo Bollo">
    <div class="fin">¡FIN DEL SHOW!</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="msg" id="msgFinal">¡Buen intento!</div>
    <div class="btn-group">
      <a href="#" class="btn-what" id="whatBtn" target="_blank">🎈 CONTRATAR SHOW</a>
      <button class="btn-retry" id="retryBtn" type="button">🔄 VOLVER A INTENTAR</button>
    </div>
  </div>
</div>
<script>
const CANVAS_W=540, CANVAS_H=960;
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const PLAYER_NORMAL_SRC="assets/pollo-avatar.png";
const PLAYER_HIT_SRC="assets/pollo-hit.png";
const SPACE_SRC="assets/space-bg.svg";
let playerImgNormal=new Image(); playerImgNormal.src=PLAYER_NORMAL_SRC;
let playerImgHit=new Image(); playerImgHit.src=PLAYER_HIT_SRC;
let spaceBgImg=new Image(); spaceBgImg.src=SPACE_SRC;
let playerImg=playerImgNormal;
let state='SPLASH';
let score=0, lives=3, difficulty=0;
let balloons=[], bullets=[], particles=[];
let shakeT=0, flashT=0, hitTimer=0;
let spawnTimer=0, shootTimer=0;
let player={x:CANVAS_W/2};
let time=0;
let gameLoopId=null, lastT=0;
const WHATSAPP_NUMBER='523314397435';
let stars=[];
for(let i=0;i<160;i++) stars.push({x:Math.random()*CANVAS_W, y:Math.random()*CANVAS_H, r:Math.random()*1.8+0.3, tw:Math.random()*Math.PI*2, speed:20+Math.random()*80, alpha:0.5+Math.random()*0.5, color:Math.random()>0.85?'#ffd400':(Math.random()>0.5?'#fff':'#aaddff')});
function updateHUD(){
  const shown=Math.min(lives,3);
  const extra=Math.max(0,lives-3);
  const red='❤️'.repeat(shown);
  const black='🖤'.repeat(3-shown);
  const gold=extra>0?'💛'.repeat(extra):'';
  document.getElementById('livesEl').innerHTML='<span style="filter:drop-shadow(0 0 4px #ff2a5a)">'+red+'</span><span style="opacity:.35;filter:grayscale(1) brightness(0.3)">'+black+'</span> <span>'+gold+'</span>';
  document.getElementById('scoreEl').textContent=score;
}
function resetGame(){
  score=0; lives=3; difficulty=0;
  balloons=[]; bullets=[]; particles=[];
  shakeT=0; flashT=0; hitTimer=0;
  spawnTimer=0; shootTimer=0;
  player.x=CANVAS_W/2;
  playerImg=playerImgNormal;
  for(let s of stars) s.y=Math.random()*CANVAS_H;
  updateHUD();
}
function spawnBalloon(){
  const roll=Math.random();
  const isHeart=roll>0.97;
  const isBad=!isHeart && roll<0.18;
  const x=40+Math.random()*(CANVAS_W-80);
  const y=-60;
  const vy=70+Math.random()*60+difficulty*22;
  const drift=(Math.random()-0.5)*30;
  if(isHeart){
    balloons.push({x,y,vx:drift,vy:vy*0.7,good:false,type:'heart',emoji:'❤️',color:'#ff2a5a',pts:0,r:32,wob:Math.random()*Math.PI*2});
    return;
  }
  if(isBad){
    const badType=Math.random()<0.6?'bomb':'cloud';
    balloons.push({x,y,vx:drift,vy:vy,good:false,type:badType,emoji:badType==='bomb'?'💣':'☁️',color:badType==='bomb'?'#111':'#fff',pts:-30,r:30,wob:Math.random()*Math.PI*2});
  } else {
    const GOOD=[{emoji:'🎈',color:'#ff3b7f',pts:20},{emoji:'🎂',color:'#ffb700',pts:25},{emoji:'🎉',color:'#a259ff',pts:20},{emoji:'⭐',color:'#ffe600',pts:15},{emoji:'🍭',color:'#ff7ab7',pts:18}];
    const g=GOOD[Math.floor(Math.random()*GOOD.length)];
    balloons.push({x,y,vx:drift,vy:vy,good:true,type:'good',emoji:g.emoji,color:g.color,pts:g.pts,r:28+Math.random()*6,wob:Math.random()*Math.PI*2});
  }
}
function shoot(){
  bullets.push({x:player.x, y:CANVAS_H-110, vx:(Math.random()-0.5)*40, vy:-520-Math.random()*120, r:6, color:'hsl('+(Math.random()*60+330)+',100%,60%)'});
}
let isPointerDown=false;
canvas.addEventListener('pointerdown', (e)=>{ isPointerDown=true; });
canvas.addEventListener('pointerup', ()=>{ isPointerDown=false; });
canvas.addEventListener('pointermove', (e)=>{
  const rect=canvas.getBoundingClientRect();
  const cx=(e.clientX-rect.left)/rect.width*CANVAS_W;
  player.x=Math.max(40, Math.min(CANVAS_W-40, cx));
});
function update(dt){
  time+=dt;
  difficulty+=dt*0.04;
  spawnTimer-=dt;
  if(spawnTimer<=0){ spawnBalloon(); spawnTimer=0.55 - Math.min(0.35, difficulty*0.02); }
  if(isPointerDown){
    shootTimer-=dt;
    if(shootTimer<=0){ shoot(); shootTimer=0.18; }
  }
  for(let i=balloons.length-1;i>=0;i--){
    let b=balloons[i];
    b.wob+=dt*3;
    b.x+=b.vx*dt + Math.sin(b.wob)*20*dt;
    b.y+=b.vy*dt;
    if(b.y>CANVAS_H+80){
      if(b.good){ lives--; updateHUD(); hitTimer=0.9; playerImg=playerImgHit; shakeT=0.35; flashT=0.18; if(lives<=0){ gameOver(); } }
      balloons.splice(i,1);
    }
  }
  for(let i=bullets.length-1;i>=0;i--){
    let bl=bullets[i];
    bl.x+=bl.vx*dt; bl.y+=bl.vy*dt;
    if(bl.y<-20){ bullets.splice(i,1); continue; }
    for(let j=balloons.length-1;j>=0;j--){
      let ba=balloons[j];
      const dx=bl.x-ba.x, dy=bl.y-ba.y;
      const d=Math.hypot(dx,dy);
      if(d < ba.r+bl.r){
        if(ba.type==='heart'){ lives=Math.min(5,lives+1); updateHUD(); score+=50; explodeHeart(ba); }
        else if(ba.good){ score+=ba.pts; explodeGood(ba); }
        else { score+=ba.pts; if(ba.type==='bomb') explodeBomb(ba); else explodeCloud(ba); hitTimer=ba.type==='bomb'?0.7:0.5; playerImg=playerImgHit; shakeT=0.4; }
        balloons.splice(j,1); bullets.splice(i,1); updateHUD(); break;
      }
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
  if(hitTimer>0){ hitTimer-=dt; if(hitTimer<=0) playerImg=playerImgNormal; }
  if(shakeT>0) shakeT-=dt;
  if(flashT>0) flashT-=dt;
}
function explodeGood(b){ for(let i=0;i<18;i++) particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*240,vy:(Math.random()-0.5)*240-20,color:b.color,life:0.6+Math.random()*0.4,r:3+Math.random()*4,type:'conf'}); }
function explodeBomb(b){ for(let i=0;i<22;i++) particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*300,vy:(Math.random()-0.5)*300,color:'#ff3300',life:0.5+Math.random()*0.4,r:4+Math.random()*5,type:'conf'}); }
function explodeCloud(b){ for(let i=0;i<12;i++) particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*180,vy:(Math.random()-0.5)*100,color:'#ffffff',life:0.5,r:6+Math.random()*6,type:'cloud'}); }
function explodeHeart(b){ for(let i=0;i<20;i++) particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.5)*260-30,color:i%2?'#ff2a5a':'#ffd400',life:0.8+Math.random()*0.5,r:4+Math.random()*4,type:'conf'}); for(let i=0;i<6;i++) particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*120,vy:-Math.random()*120-20,color:'#ff7aa5',life:0.6,r:8,type:'heartPop'}); }
function drawBalloon(b){
  ctx.save(); ctx.translate(b.x,b.y);
  ctx.globalAlpha=0.25; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(2,8,b.r*0.9,b.r*0.6,0,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(0,b.r); ctx.bezierCurveTo(4,b.r+14,-4,b.r+28,0,b.r+40); ctx.stroke();
  const grd=ctx.createRadialGradient(-b.r*0.2,-b.r*0.3,0,0,0,b.r);
  grd.addColorStop(0,'#ffffff'); grd.addColorStop(0.2,b.color); grd.addColorStop(1,'#00000022');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(-b.r*0.25,-b.r*0.3,b.r*0.18,0,Math.PI*2); ctx.fill();
  const pulse=b.type==='heart'?1+Math.sin(time*6)*0.18:1;
  ctx.font=(b.r*1.1*pulse)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.emoji,0,2);
  if(b.type==='heart'){ ctx.fillStyle='rgba(255,42,90,.25)'; ctx.beginPath(); ctx.arc(0,0,b.r+10*pulse,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawPlayer(){
  const y=CANVAS_H-70;
  ctx.save(); ctx.translate(player.x,y);
  if(hitTimer>0){ ctx.translate((Math.random()-0.5)*6, (Math.random()-0.5)*6); }
  const size=78;
  ctx.shadowColor='#ffd400'; ctx.shadowBlur=hitTimer>0?20:12;
  ctx.beginPath(); ctx.arc(0,0,size/2,0,Math.PI*2); ctx.fillStyle='#3a0b5e'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(0,0,size/2,0,Math.PI*2); ctx.fillStyle='#ffd400'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,size/2-4,0,Math.PI*2); ctx.clip();
  if(playerImg.complete && playerImg.naturalWidth>0) ctx.drawImage(playerImg,-size/2+4,-size/2+4,size-8,size-8);
  ctx.restore();
}
function renderFrame(dt){
  ctx.save();
  if(shakeT>0) ctx.translate((Math.random()-0.5)*18,(Math.random()-0.5)*18);
  if(spaceBgImg.complete) ctx.drawImage(spaceBgImg,0,0,CANVAS_W,CANVAS_H);
  else { ctx.fillStyle='#04060e'; ctx.fillRect(0,0,CANVAS_W,CANVAS_H); }
  for(let s of stars){
    s.y+=s.speed*dt*0.3; s.tw+=dt*2;
    if(s.y>CANVAS_H+10){ s.y=-10; s.x=Math.random()*CANVAS_W; }
    const twinkle=0.7+Math.sin(s.tw)*0.3;
    ctx.globalAlpha=s.alpha*twinkle;
    ctx.fillStyle=s.color; ctx.shadowColor=s.color; ctx.shadowBlur=s.r>1.2?6:0;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    if(s.r>1.4){ ctx.globalAlpha=s.alpha*0.12*twinkle; ctx.fillRect(s.x-8,s.y-0.5,16,1); ctx.fillRect(s.x-0.5,s.y-8,1,16); }
  }
  ctx.globalAlpha=1;
  for(let b of balloons) drawBalloon(b);
  for(let bl of bullets){ ctx.fillStyle=bl.color; ctx.beginPath(); ctx.arc(bl.x,bl.y,bl.r,0,Math.PI*2); ctx.fill(); }
  for(let p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.type==='heartPop'){ ctx.font=(p.r*2)+'px serif'; ctx.fillText('❤️',p.x-p.r,p.y); }
    else { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
  }
  ctx.globalAlpha=1;
  drawPlayer();
  if(flashT>0){ ctx.fillStyle='rgba(255,42,90,'+(flashT*2)+')'; ctx.fillRect(0,0,CANVAS_W,CANVAS_H); }
  ctx.restore();
}
function loop(now){
  if(state!=='PLAYING') return;
  const dt=Math.min(0.033,(now-lastT)/1000);
  lastT=now;
  update(dt);
  renderFrame(dt);
  gameLoopId=requestAnimationFrame(loop);
}
function startLoop(){
  if(gameLoopId) cancelAnimationFrame(gameLoopId);
  lastT=performance.now();
  gameLoopId=requestAnimationFrame(loop);
}
function gameOver(){
  state='GAMEOVER';
  if(gameLoopId) cancelAnimationFrame(gameLoopId);
  document.getElementById('finalScore').textContent=score;
  document.getElementById('gameover').classList.remove('hidden');
  document.getElementById('whatBtn').href='https://wa.me/'+WHATSAPP_NUMBER+'?text='+encodeURIComponent('¡Hola Pollo Bollo! Hice '+score+' puntos 🎈 Quiero contratar tu show!');
}
function updateLoad(pct, detail){
  document.getElementById('loadBar').style.width=pct+'%';
  document.getElementById('loadPct').textContent=pct+'%';
  document.getElementById('loadDetail').textContent=detail||'';
}
function preloadAndStart(){
  let pct=0;
  const iv=setInterval(()=>{
    pct+=Math.random()*12+8;
    if(pct>=100){ pct=100; clearInterval(iv); document.getElementById('loadingScreen').classList.add('hidden'); state='PLAYING'; resetGame(); startLoop(); }
    updateLoad(Math.floor(pct), pct<30?'Preparando nave...':pct<70?'Cargando diversión...':pct<100?'¡Casi listo!':'¡A jugar!');
  }, 85);
}
function startGame(){
  if(state!=='SPLASH') return;
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('loadingScreen').classList.remove('hidden');
  updateLoad(0,'Preparando nave...');
  setTimeout(preloadAndStart, 120);
}
function restartGame(){
  if(gameLoopId) cancelAnimationFrame(gameLoopId);
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('loadingScreen').classList.remove('hidden');
  updateLoad(0,'Recargando...');
  setTimeout(preloadAndStart, 120);
}
window.addEventListener('load', ()=>{
  const btn=document.getElementById('btnPlay');
  if(btn){ btn.onclick=startGame; btn.ontouchend=(e)=>{ e.preventDefault(); startGame(); }; }
  document.getElementById('retryBtn').onclick=restartGame;
  document.getElementById('retryBtn').ontouchend=(e)=>{ e.preventDefault(); restartGame(); };
  document.getElementById('splash').onclick=(e)=>{ if(e.target.id==='splash') startGame(); };
  updateHUD();
});
</script>
</body>
</html>
